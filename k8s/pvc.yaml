apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bond-portfolio-data
  namespace: bond-portfolio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Для локального тестирования (minikube/kind) используется storageClass по умолчанию.
  # Для облачного провайдера (Yandex Managed K8s и т.п.) storageClass будет автоматически определён.